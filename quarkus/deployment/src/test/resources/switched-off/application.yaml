quarkus:
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:election-cache-switched-off;DB_CLOSE_DELAY=-1
vanillabp:
  prioritized-adapters:
    - c7
  adapters:
    c7:
      type: camunda7
      name-clash-avoidance: none
  workflow-modules:
    election-cache-test-module:
      adapters:
        c7:
          resources-location: classpath:election-cache-test-module/processes/none
  workflow-adapter-cache:
    hazelcast:
      enabled: false
