quarkus:
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:election-cache-test;DB_CLOSE_DELAY=-1
vanillabp:
  prioritized-adapters:
    - c7
  adapters:
    c7:
      type: camunda7
      name-clash-avoidance: none
  workflow-modules:
    election-cache-test-module:
      adapters:
        c7:
          resources-location: classpath:election-cache-test-module/processes/none
  workflow-adapter-cache:
    ended-time-to-live: PT1S
    hazelcast:
      cluster-name: quarkus-application-test
      discovery: members
      members:
        - 127.0.0.1:15811
        - 127.0.0.1:15812
      port: 15811
      alone-reminder-interval: PT1H
